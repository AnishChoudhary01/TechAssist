services:
  api:
    build: .
    command: uvicorn app.service_apps.api:app --host 0.0.0.0 --port 8000
    environment:
      RAG_SERVICE_URL: http://rag:8001
      LLM_SERVICE_URL: http://llm:8002
      OLLAMA_TIMEOUT_SECONDS: "120"
    depends_on:
      - rag
      - llm
    ports:
      - "8000:8000"

  rag:
    build: .
    command: uvicorn app.service_apps.rag:app --host 0.0.0.0 --port 8001
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SECONDS: "120"
      CHROMA_PERSIST_DIRECTORY: /app/chroma_data
      KNOWLEDGE_BASE_DIRECTORY: /app/data/knowledge_base
    depends_on:
      - ollama
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/app/chroma_data
      - ./data/knowledge_base:/app/data/knowledge_base:ro

  llm:
    build: .
    command: uvicorn app.service_apps.llm:app --host 0.0.0.0 --port 8002
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:0.5b-instruct}
      OLLAMA_TIMEOUT_SECONDS: "120"
    depends_on:
      - ollama
    ports:
      - "8002:8002"

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:0.5b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    command: >
      sh -c "sleep 5 && ollama pull $$OLLAMA_MODEL && ollama pull $$OLLAMA_EMBEDDING_MODEL"
    restart: "no"

volumes:
  chroma_data:
  ollama_data:
